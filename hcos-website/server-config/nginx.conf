# ============================================================================
# HCOS website — Nginx server block
#
# Drop into /etc/nginx/sites-available/hcosservices.com and symlink into
# sites-enabled. Adjust `root` to wherever you unpack dist/.
#
# Assumes TLS is terminated here via certbot / your usual certificate flow.
# Replace the ssl_certificate lines or remove the 443 block if a load balancer
# terminates TLS in front of this box.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hcosservices.com www.hcosservices.com;
    return 301 https://hcosservices.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hcosservices.com;

    ssl_certificate     /etc/letsencrypt/live/hcosservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcosservices.com/privkey.pem;

    return 301 https://hcosservices.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hcosservices.com;

    ssl_certificate     /etc/letsencrypt/live/hcosservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcosservices.com/privkey.pem;

    root  /var/www/hcosservices.com/dist;
    index index.html;

    # --- Clean URLs -----------------------------------------------------------
    # The site links to /about, /events/hr-seasons etc. with no extension.
    # Serve the matching .html file; fall through to the branded 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # If someone hits /about.html directly, send them to the canonical /about.
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- Caching ------------------------------------------------------------
    # Assets are content-stable; HTML must always revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    # --- Security headers -----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # Never serve build tooling if it was uploaded by mistake.
    location ~ ^/(src|build\.js|serve\.js|check-links\.js|package\.json|vercel\.json)($|/) {
        return 404;
    }
}
